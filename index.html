<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tunisia Drought Early Warning System</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 350px;
            bottom: 0;
        }

        #sidebar {
            position: absolute;
            top: 0;
            right: 0;
            width: 350px;
            height: 100vh;
            background: white;
            padding: 20px;
            overflow-y: auto;
            box-shadow: -2px 0 8px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }

        #sidebar h2 {
            margin-top: 0;
        }

        #info {
            margin-top: 20px;
            padding: 15px;
            background: #f3f3f3;
            border-radius: 6px;
            line-height: 1.5;
            word-break: break-word;
        }

        .error {
            color: #b00020;
            background: #ffecec;
            padding: 12px;
            border-radius: 6px;
        }

        .loading {
            color: #555;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="sidebar">
    <h2>Governorate Data</h2>

    <div id="info">
        <div class="loading">
            Loading governorates...
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>

<script>

const map = L.map("map").setView(
    [33.8, 9.5],
    6
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 18,
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


const info =
    document.getElementById("info");


const BASE_URL =
    "https://raw.githubusercontent.com/badIS-6/Tunisia-Vegetation-Web-Map/main/Tunisia_shapefiles/";


async function fetchArrayBuffer(url) {

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status +
            ": " +
            url
        );

    }

    return await response.arrayBuffer();
}


async function fetchText(url) {

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status +
            ": " +
            url
        );

    }

    return await response.text();
}


async function loadGovernorates() {

    try {

        info.innerHTML =
            '<div class="loading">' +
            'Loading Tunisia governorates...' +
            '</div>';


        const shpURL =
            BASE_URL +
            "Tunisia_gov.shp";


        const shxURL =
            BASE_URL +
            "Tunisia_gov.shx";


        const dbfURL =
            BASE_URL +
            "Tunisia_gov.dbf";


        const prjURL =
            BASE_URL +
            "Tunisia_gov.prj";


        const [
            shpBuffer,
            shxBuffer,
            dbfBuffer,
            prjText
        ] = await Promise.all([

            fetchArrayBuffer(
                shpURL
            ),

            fetchArrayBuffer(
                shxURL
            ),

            fetchArrayBuffer(
                dbfURL
            ),

            fetchText(
                prjURL
            )

        ]);


        console.log(
            "SHP:",
            shpBuffer.byteLength,
            "bytes"
        );


        console.log(
            "SHX:",
            shxBuffer.byteLength,
            "bytes"
        );


        console.log(
            "DBF:",
            dbfBuffer.byteLength,
            "bytes"
        );


        console.log(
            "PRJ:",
            prjText
        );


        if (
            typeof shpjs ===
            "undefined"
        ) {

            throw new Error(
                "shpjs library failed to load."
            );

        }


        const geometries =
            shpjs.parseShp(
                shpBuffer,
                prjText
            );


        const properties =
            shpjs.parseDbf(
                dbfBuffer
            );


        const geojson =
            shpjs.combine([
                geometries,
                properties
            ]);


        console.log(
            "GeoJSON:",
            geojson
        );


        if (
            !geojson ||
            !geojson.features ||
            geojson.features.length === 0
        ) {

            throw new Error(
                "The shapefile contains no features."
            );

        }


        let governorateLayer;


        governorateLayer =
            L.geoJSON(
                geojson,
                {

                    style:
                        function () {

                            return {
                                color: "#333",
                                weight: 1,
                                fillColor: "#3388ff",
                                fillOpacity: 0.25
                            };

                        },


                    onEachFeature:
                        function (
                            feature,
                            layer
                        ) {

                            layer.on({

                                mouseover:
                                    function (
                                        event
                                    ) {

                                        event.target.setStyle({
                                            weight: 2,
                                            fillOpacity: 0.45
                                        });

                                    },


                                mouseout:
                                    function (
                                        event
                                    ) {

                                        governorateLayer.resetStyle(
                                            event.target
                                        );

                                    },


                                click:
                                    function () {

                                        showGovernorate(
                                            feature.properties
                                        );

                                    }

                            });

                        }

                }
            );


        governorateLayer.addTo(
            map
        );


        map.fitBounds(
            governorateLayer.getBounds()
        );


        info.innerHTML =
            "<p>" +
            "Click a governorate on the map." +
            "</p>";


    } catch (error) {

        console.error(
            "SHAPEFILE ERROR:",
            error
        );


        info.innerHTML =
            '<div class="error">' +

            "<strong>" +
            "Shapefile Error" +
            "</strong>" +

            "<p>" +
            error.message +
            "</p>" +

            "</div>";

    }

}


function showGovernorate(
    properties
) {

    if (
        !properties
    ) {

        info.innerHTML =
            "<p>No attribute data available.</p>";

        return;

    }


    let html =
        "<h3>Governorate Data</h3>";


    Object.keys(
        properties
    ).forEach(
        function (key) {

            html +=
                "<p>" +

                "<strong>" +
                key +
                ":</strong> " +

                (
                    properties[key] ??
                    ""
                ) +

                "</p>";

        }
    );


    info.innerHTML =
        html;

}


loadGovernorates();

</script>

</body>
</html>
