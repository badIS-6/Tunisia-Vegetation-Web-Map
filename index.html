<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tunisia Vegetation Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 350px;
            bottom: 0;
        }

        #sidebar {
            position: absolute;
            top: 0;
            right: 0;
            width: 350px;
            height: 100vh;
            background: white;
            padding: 20px;
            overflow-y: auto;
            box-shadow: -2px 0 8px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }

        #sidebar h2 {
            margin-top: 0;
        }

        #info {
            margin-top: 20px;
            padding: 15px;
            background: #f3f3f3;
            border-radius: 6px;
            line-height: 1.5;
            word-break: break-word;
        }

        #info h3 {
            margin-top: 0;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid #ddd;
        }

        .data-row strong {
            color: #333;
        }

        .data-row span {
            text-align: right;
        }

        .error {
            color: #b00020;
            background: #ffecec;
            padding: 12px;
            border-radius: 6px;
        }

        .loading {
            color: #555;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
            z-index: 1000;
            font-size: 13px;
        }

        .legend-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .legend-gradient {
            width: 200px;
            height: 15px;
            background: linear-gradient(
                to right,
                red,
                yellow,
                green
            );
            border: 1px solid #999;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
        }

    </style>

</head>


<body>


<div id="map"></div>


<div id="sidebar">
    <h2>Tunisia Vegetation Data</h2>

    <a href="variables.html" target="_blank">Variable Explanations</a>
    <div id="info">

        <div class="loading">
            Loading governorates...
        </div>

    </div>
    <a href="context.html" target="_blank">About the Project</a>
    <img src="logo.jpg" alt="Logo" width="60" style="position: absolute; bottom: 10px; right: 10px;">
</div>


<div class="legend">

    <div class="legend-title">
        NDVI
    </div>

    <div class="legend-gradient"></div>

    <div class="legend-labels">
        <span>Low</span>
        <span>High</span>
    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/shpjs@latest/dist/shp.js"></script>


<script>




const map = L.map("map").setView(
    [33.8, 9.5],
    6
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 18,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);


const info = document.getElementById("info");



const BASE_URL =
    "https://raw.githubusercontent.com/badIS-6/Tunisia-Vegetation-Web-Map/main/Tunisia_shapefiles/";

const CSV_URL = "tunisia_ndvi.csv";


let governorateData = {};




function normalizeGovernorateName(name) {

    if (!name) {
        return "";
    }

    return name
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/['’`-]/g, " ")
        .replace(/\bgovernorate\b/g, "")
        .replace(/\bdelegation\b/g, "")
        .replace(/\bgouvernorat\b/g, "")
        .replace(/\bgouvernorat de\b/g, "")
        .replace(/\s+/g, " ")
        .trim();

}




const governorateAliases = {

    "tunis": "tunis",

    "ariana": "ariana",

    "ben arous": "ben arous",

    "manouba": "manouba",

    "la manouba": "manouba",

    "nabeul": "nabeul",

    "bizerte": "bizerte",

    "beja": "beja",

    "jendouba": "jendouba",

    "kef": "kef",

    "le kef": "kef",

    "el kef": "kef",

    "siliana": "siliana",

    "zaghouan": "zaghouan",

    "sousse": "sousse",

    "monastir": "monastir",

    "mahdia": "mahdia",

    "kairouan": "kairouan",

    "kasserine": "kasserine",

    "sidi bouzid": "sidi bouzid",

    "sidi bou zid": "sidi bouzid",

    "sfax": "sfax",

    "gabes": "gabes",

    "medenine": "medenine",

    "tataouine": "tataouine",

    "gafsa": "gafsa",

    "tozeur": "tozeur",

    "kebili": "kebili"

};




function canonicalGovernorateName(name) {

    const normalized =
        normalizeGovernorateName(name);

    if (governorateAliases[normalized]) {

        return governorateAliases[normalized];

    }

    return normalized;

}



function parseCSVLine(line) {

    const result = [];

    let current = "";

    let insideQuotes = false;


    for (let i = 0; i < line.length; i++) {

        const char = line[i];


        if (
            char === '"' &&
            line[i + 1] === '"'
        ) {

            current += '"';

            i++;

        }

        else if (char === '"') {

            insideQuotes = !insideQuotes;

        }

        else if (
            char === "," &&
            !insideQuotes
        ) {

            result.push(current);

            current = "";

        }

        else {

            current += char;

        }

    }


    result.push(current);


    return result;

}


function parseCSV(text) {

    const lines =
        text.trim().split(/\r?\n/);

    const headers =
        parseCSVLine(lines[0]);

    const rows = [];


    for (let i = 1; i < lines.length; i++) {

        if (!lines[i].trim()) {
            continue;
        }


        const values =
            parseCSVLine(lines[i]);

        const row = {};


        headers.forEach(
            function(header, index) {

                row[header.trim()] =
                    values[index] ?? "";

            }
        );


        rows.push(row);

    }


    return rows;

}



async function loadCSVData() {

    const response =
        await fetch(CSV_URL);


    if (!response.ok) {

        throw new Error(
            "Could not load CSV file: " +
            response.status
        );

    }


    const csvText =
        await response.text();


    const rows =
        parseCSV(csvText);


    if (!rows.length) {

        throw new Error(
            "CSV file contains no data."
        );

    }


    rows.forEach(
        function(row) {

            const name =
                row["governorate_name"];


            if (!name) {
                return;
            }


            const key =
                canonicalGovernorateName(name);


            governorateData[key] =
                row;

        }
    );


    console.log(
        "Loaded governorates from CSV:",
        Object.keys(governorateData)
    );

}



function findGovernorateData(properties) {

    if (!properties) {
        return null;
    }


    

    for (
        const value of Object.values(properties)
    ) {

        if (
            value === null ||
            value === undefined
        ) {
            continue;
        }


        const key =
            canonicalGovernorateName(value);


        if (governorateData[key]) {

            return governorateData[key];

        }

    }


    return null;

}




function getGovernorateName(properties) {

    if (!properties) {
        return "Unknown";
    }


    for (
        const value of Object.values(properties)
    ) {

        if (
            value === null ||
            value === undefined
        ) {
            continue;
        }


        const key =
            canonicalGovernorateName(value);


        if (governorateData[key]) {

            return governorateData[key]
                .governorate_name;

        }

    }


    return "Unknown";

}




function getNDVI(properties) {

    const data =
        findGovernorateData(properties);


    if (!data) {
        return null;
    }


    const value =
        parseFloat(data.ndvi);


    if (isNaN(value)) {
        return null;
    }


    return value;

}




function getNDVIColor(ndvi) {

    if (
        ndvi === null ||
        ndvi === undefined ||
        isNaN(ndvi)
    ) {

        return "#cccccc";

    }


    


    let value = Math.max(
        -1,
        Math.min(1, ndvi)
    );



    let ratio =
        (value + 1) / 2;


    let r;
    let g;


    if (ratio < 0.5) {


        const t = ratio * 2;

        r = 255;

        g = Math.round(
            255 * t
        );

    }

    else {


        const t =
            (ratio - 0.5) * 2;

        r = Math.round(
            255 * (1 - t)
        );

        g = 255;

    }


    return (
        "rgb(" +
        r +
        "," +
        g +
        ",0)"
    );

}




async function loadGovernorates() {

    try {

        info.innerHTML =
            '<div class="loading">' +
            "Loading Tunisia governorates..." +
            "</div>";


       

        await loadCSVData();


        

        if (typeof shp === "undefined") {

            throw new Error(
                "shp library failed to load."
            );

        }


        const geojson = await shp(
            BASE_URL + "Tunisia_gov"
        );


        if (
            !geojson ||
            !geojson.features ||
            geojson.features.length === 0
        ) {

            throw new Error(
                "The shapefile contains no features."
            );

        }


        

        let governorateLayer;


        governorateLayer = L.geoJSON(
            geojson,
            {

                
                style: function(feature) {

                    const ndvi =
                        getNDVI(
                            feature.properties
                        );


                    return {

                        color: "#333",

                        weight: 1,

                        fillColor:
                            getNDVIColor(ndvi),

                        fillOpacity: 0.65

                    };

                },


                

                onEachFeature:
                    function(feature, layer) {


                    layer.on({

                        

                        mouseover:
                            function(event) {

                            event.target.setStyle({

                                weight: 2,

                                fillOpacity: 0.85

                            });

                        },


                        

                        mouseout:
                            function(event) {

                            governorateLayer
                                .resetStyle(
                                    event.target
                                );

                        },


                        

                        click:
                            function() {

                            showGovernorate(
                                feature.properties
                            );

                        }

                    });

                }

            }
        );



        governorateLayer.addTo(map);



        map.fitBounds(
            governorateLayer.getBounds()
        );


        info.innerHTML =
            "<p>Click a governorate on the map.</p>";


    }

    catch (error) {

        console.error(
            "ERROR:",
            error
        );


        info.innerHTML =
            '<div class="error">' +

            "<strong>Loading Error</strong>" +

            "<p>" +

            error.message +

            "</p>" +

            "</div>";

    }

}




function showGovernorate(properties) {

    if (!properties) {

        info.innerHTML =
            "<p>No attribute data available.</p>";

        return;

    }


    const governorateName =
        getGovernorateName(properties);


    let html =
        "<h3>" +
        governorateName +
        "</h3>";


    const data =
        findGovernorateData(properties);


    

    if (!data) {

        html +=

            '<div class="error">' +

            "<strong>No CSV data found.</strong>" +

            "<p>" +

            "Could not match this governorate " +
            "with the CSV data." +

            "</p>" +

            "</div>";


        info.innerHTML = html;


        console.warn(
            "No CSV match for shapefile properties:",
            properties
        );


        return;

    }


    

    const fields = [

        ["NDVI", "ndvi"],

        ["NDVI Anomaly", "ndvi_anomaly"],

        ["PET (mm)", "pet_mm"],

        ["Rainfall (mm)", "rainfall_mm"],

        ["Soil Moisture", "soil_moisture"],

        [
            "Soil Moisture Anomaly",
            "soil_moisture_anomaly"
        ],

        [
            "Soil Moisture Anomaly (%)",
            "soil_moisture_anomaly_pct"
        ],

        ["TCI", "tci"],

        ["VCI", "vci"],

        ["VHI", "vhi"]

    ];


    

    fields.forEach(
        function(field) {

            const label =
                field[0];

            const key =
                field[1];


            let value =
                data[key];


            if (
                value === undefined ||
                value === null ||
                value === ""
            ) {

                value = "N/A";

            }

            else if (!isNaN(value)) {

                value =
                    Number(value).toFixed(4);

            }


            html +=

                '<div class="data-row">' +

                "<strong>" +
                label +
                "</strong>" +

                "<span>" +
                value +
                "</span>" +

                "</div>";

        }
    );


    

    info.innerHTML = html;

}




loadGovernorates();


</script>

</body>

</html>
